<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tin Trong Ngày — bảng tin tự cập nhật mỗi ngày</title>
<meta name="description" content="Bảng tin tổng hợp những tin mới nhất trong ngày từ VnExpress, Tuổi Trẻ, Thanh Niên, Dân Trí, Người Lao Động. Tự cập nhật, không cần tải lại trang.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23b4232a'/%3E%3Cpath d='M8 10h16v3H8zM8 16h11v3H8zM8 22h16v2H8z' fill='%23fff'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;800&family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<header class="masthead">
  <div class="masthead-inner">
    <div class="brand">
      <h1>Tin Trong Ngày</h1>
      <p class="tagline">Bảng tin tự động tổng hợp báo chí Việt Nam</p>
    </div>
    <div class="dayline">
      <p id="today" class="today">&nbsp;</p>
      <p id="stamp" class="stamp">Đang tải bảng tin…</p>
    </div>
  </div>
</header>

<div class="toolbar">
  <div class="toolbar-inner">
    <nav id="filters" class="filters" aria-label="Lọc theo nguồn tin"></nav>
    <div class="tools">
      <label class="search">
        <span class="sr-only">Tìm tin</span>
        <input id="search" type="search" placeholder="Tìm trong bảng tin…" autocomplete="off">
      </label>
      <button id="refresh" class="btn" type="button" aria-label="Tải tin mới nhất">
        <span id="refresh-icon" aria-hidden="true">⟳</span>
        <span id="countdown" class="countdown"></span>
      </button>
    </div>
  </div>
</div>

<main id="main">
  <div id="banner" class="banner" role="status" hidden></div>
  <p id="newpill" class="newpill" hidden></p>
  <section id="feed" class="feed" aria-live="polite">
    <div class="skeleton-grid" id="skeletons" aria-hidden="true"></div>
  </section>
  <section class="sources" id="sources" hidden>
    <h2>Tình trạng nguồn tin</h2>
    <ul id="source-list"></ul>
  </section>
</main>

<footer class="foot">
  <p>Bản tin do máy tổng hợp tự động từ RSS của các tòa soạn; mỗi tin giữ nguyên link về bài gốc.</p>
  <p><span id="foot-stamp"></span></p>
</footer>

<script src="/app.js" defer></script>
</body>
</html>
